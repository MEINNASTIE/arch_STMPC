<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPC Data Visualization</title>

    <!-- ECharts (LOCAL) -->
    <script src="./resources/js_echarts/echarts.min.js"></script>

    <!-- Bootstrap for styling -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Optional JS for Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.1/dist/js/all.min.js"></script>
</head>
<body>
    <h1>MPC Data Visualization (stacked view)</h1>
    <div class="form-group">
        <label for="app_ip">MPC chart:</label>
        <input type="text" class="form-control" id="fApiUrlStorage" placeholder="API Endpoint" required>
    </div>
    <div>
        <button type="button" id="bRequest" class="btn btn-primary" onclick="fetchData()">Request measurements</button>
        <label id="fProgress"></label>
    </div>
    <div id="chart-container"></div>

    <script>
        window.onload = function () {
            const savedUrl = localStorage.getItem('lastApiUrl') || 'api/meas/storage/files?maxcount=100&includedata=10000,10002&miid=0';
            document.getElementById('fApiUrlStorage').value = savedUrl;
        };

        function scaleTo125Ceil(value) {
            const exp = Math.floor(Math.log10(value));
            const base = value / Math.pow(10, exp);
            let niceBase;
            if (base <= 1) niceBase = 1;
            else if (base <= 2) niceBase = 2;
            else if (base <= 5) niceBase = 5;
            else niceBase = 10;
            return niceBase * Math.pow(10, exp);
        }

        async function fetchData() {
            const apiUrl = document.getElementById('fApiUrlStorage').value;
            document.getElementById("fProgress").innerText = "Fetching data from " + apiUrl + " ...";
            document.getElementById("bRequest").style.display = 'none';
            localStorage.setItem('lastApiUrl', apiUrl);

            try {
                const response = await fetch(apiUrl);
                const dataTmp = await response.json();
                const data = dataTmp.payload;

                document.getElementById("fProgress").innerText = "Done in " + dataTmp.duration + " msec. Received " + data.length + " values at " + dataTmp.nowUTC;

                data.sort((a, b) => new Date(a.mtime) - new Date(b.mtime));

                const traces = {};
                data.forEach(entry => {
                    if (entry.data !== '') {
                        const parsed = JSON.parse(entry.data);
                        for (const [key, value] of Object.entries(parsed)) {
                            if (!traces[key]) traces[key] = { x: [], y: [] };
                            traces[key].x.push(entry.mtime);
                            traces[key].y.push(value);
                        }
                    }
                });

                const container = document.getElementById('chart-container');
                container.innerHTML = '';

                const chartDiv = document.createElement('div');
                chartDiv.id = 'stacked-chart';
                chartDiv.style.width = '100%';
                chartDiv.style.height = `${Object.keys(traces).length * 300}px`;
                container.appendChild(chartDiv);

                const keys = Object.keys(traces);
                const xShared = traces[keys[0]].x.map(t => new Date(t).toISOString());

                const grids = [];
                const yAxes = [];
                const series = [];

                keys.forEach((key, idx) => {
                    const trace = traces[key];
                    const yVals = trace.y.filter(y => y !== null);
                    const maxY = scaleTo125Ceil(Math.max(...yVals));
                    const gridTop = 5 + idx * (90 / keys.length);

					const gridHeight = 80 / keys.length;
					const gridGap = 5; // 5% visual spacing between charts

					grids.push({
						top: `${5 + idx * (gridHeight + gridGap)}%`,
						height: `${gridHeight}%`,
						left: 60,
						right: 30
					});

yAxes.push({
    type: 'value',
    min: 0,
    max: maxY,
    name: key,
    gridIndex: idx,
    position: 'left',
    nameTextStyle: {
        fontWeight: 'bold',
        fontSize: 12
    },
    axisLabel: {
        fontSize: 11
    }
});
                    series.push({
                        name: key,
                        type: 'line',
xAxisIndex: idx,
yAxisIndex: idx,
                        data: xShared.map((x, i) => {
                            const y = trace.y[i];
                            return (y != null ? [x, y] : null);
                        }).filter(p => p),
                        showSymbol: true,
                        smooth: false
                    });
                });

const xAxis = keys.map((_, idx) => ({
    type: 'time',
    name: 'Time',
    gridIndex: idx
}));

const xAxisIndices = keys.map((_, idx) => idx);

const dataZoom = [
    { type: 'slider', xAxisIndex: xAxisIndices },
    { type: 'inside', xAxisIndex: xAxisIndices }
];				
				
				
               const option = {
    tooltip: { trigger: 'axis' },
    dataZoom: dataZoom,
    grid: grids,
    xAxis: keys.map((_, idx) => ({
        type: 'time',
        name: 'Time',
        gridIndex: idx
    })),
    yAxis: yAxes,
    series: series
};

                const chart = echarts.init(chartDiv);
                chart.setOption(option);

            } catch (error) {
                console.error('Error fetching data:', error);
            }

			chartDiv.style.height = `${keys.length * 320}px`; // from 300 to 320

			
            document.getElementById("bRequest").style.display = '';
        }
    </script>
</body>
</html>
