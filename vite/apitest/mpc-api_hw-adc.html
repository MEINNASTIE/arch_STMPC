<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data Monitor</title>
    <script src="resources/js_echarts/echarts.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 100%; margin: auto; text-align: center; }
        .input-group { margin: 10px 0; }
        #chart { width: 100%; height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>HW API Data Monitor</h2>
        <label>Read Cycle (seconds): <input type="number" id="fReadCycle" value="10"></label>
        <label>Max Records: <input type="number" id="fMaxRecs" value="1000"></label>
        <div class="input-group">
            <input type="checkbox" id="chkTempScint" checked>
            <label>Temperature Scint: <input type="text" id="fUrlTempScint" value="/api/hw/sensor/temp/scint_air?delay=2&samples=50"></label>
        </div>
        <div class="input-group">
            <input type="checkbox" id="chkVoltExt" checked>
            <label>Voltage External: <input type="text" id="fUrlVoltExt" value="/api/hw/sensor/voltage/ext?delay=2&samples=50"></label>
        </div>
        <div class="input-group">
            <input type="checkbox" id="chkVoltInt" checked>
            <label>Voltage Internal: <input type="text" id="fUrlVoltInt" value="/api/hw/sensor/voltage/int?delay=2&samples=50"></label>
        </div>
        <div class="input-group">
            <input type="checkbox" id="chkTempExt" checked>
            <label>Temperature External: <input type="text" id="fUrlTempExt" value="/api/hw/sensor/temp/ext_water?delay=2&samples=50"></label>
        </div>
        <button onclick="startReadout()">Start</button>
        <button onclick="stopReadout()">Stop</button>
        <button onclick="clearChart()">Clear</button>
        <p id="statusLabel">Cycle stopped</p>
        <div id="chart"></div>
    </div>
    <script>
let chart = echarts.init(document.getElementById('chart'));
let stopFlag = false;
let intervalId = null; // Stores the interval reference
let data = { tempScint: [], voltExt: [], voltInt: [], tempExt: [], timestamps: [] };

function startReadout() {
    if (intervalId !== null) return; // Prevent multiple intervals

    stopFlag = false;
    document.getElementById('statusLabel').innerText = 'Reading started';

    async function cycle() {
        await fetchData();
    }

    // Read fetch cycle time from the input field
    let fetchCycleTime = parseInt(document.getElementById('fReadCycle').value);
    cycle(); // Run immediately, then on an interval
    intervalId = setInterval(cycle, fetchCycleTime * 1000);
}

function stopReadout() {
    stopFlag = true;
    if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
    }
    document.getElementById('statusLabel').innerText = 'Cycle stopped';
}

function clearChart() {
    data = { tempScint: [], voltExt: [], voltInt: [], tempExt: [], timestamps: [] };
    updateChart();
}

async function fetchData() {
    let now = new Date();
    let maxRecs = parseInt(document.getElementById('fMaxRecs').value);
    let urls = [
        { key: 'temp_scint_air', dataKey: 'tempScint', url: document.getElementById('fUrlTempScint').value, checked: document.getElementById('chkTempScint').checked },
        { key: 'volt_ext', dataKey: 'voltExt', url: document.getElementById('fUrlVoltExt').value, checked: document.getElementById('chkVoltExt').checked },
        { key: 'volt_int', dataKey: 'voltInt', url: document.getElementById('fUrlVoltInt').value, checked: document.getElementById('chkVoltInt').checked },
        { key: 'temp_water_ext', dataKey: 'tempExt', url: document.getElementById('fUrlTempExt').value, checked: document.getElementById('chkTempExt').checked }
    ];

    try {
        for (let item of urls) {
            if (item.checked) {
                let response = await fetch(item.url);
                let result = await response.json();

                // Ensure key exists in payload
                if (result.payload && item.key in result.payload) {
                    // Ensure data array exists
                    if (!data[item.dataKey]) {
                        data[item.dataKey] = [];
                    }

                    data[item.dataKey].push(result.payload[item.key]);
                } else {
                    console.warn(`Missing expected key '${item.key}' in API response`);
                }
            }
        }

        data.timestamps.push(now);

        if (maxRecs > 0 && data.timestamps.length > maxRecs) {
            Object.keys(data).forEach(key => {
                if (Array.isArray(data[key])) {
                    data[key].splice(0, data.timestamps.length - maxRecs);
                }
            });
        }

        updateChart();
        document.getElementById('statusLabel').innerText = `Last read: ${now.toLocaleTimeString()}, Next: in ${parseInt(document.getElementById('fReadCycle').value)}s`;
    } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('statusLabel').innerText = 'Error fetching data';
    }
}

function updateChart() {
    chart.setOption({
        tooltip: { trigger: 'axis' },
        dataZoom: [
            { type: 'inside' }, // Allows zooming inside the chart
            { type: 'slider' }, // Allows zooming via a slider at the bottom
            { type: 'inside', yAxisIndex: [0], filterMode: 'filter', startValue: 0, endValue: 100 },
			    { type: 'slider', yAxisIndex: [0], filterMode: 'filter' } // This adds a vertical slider

        ],
        legend: { data: ['Temp Scint', 'Volt Ext', 'Volt Int', 'Temp Ext'] },
        xAxis: { type: 'time', data: data.timestamps },
        yAxis: {
            type: 'value',
            scale: true, // Allows for scaling on y-axis
        },
        series: [
            { name: 'Temp Scint', type: 'line', data: data.timestamps.map((t, i) => [t, data.tempScint[i] || null]) },
            { name: 'Volt Ext', type: 'line', data: data.timestamps.map((t, i) => [t, data.voltExt[i] || null]) },
            { name: 'Volt Int', type: 'line', data: data.timestamps.map((t, i) => [t, data.voltInt[i] || null]) },
            { name: 'Temp Ext', type: 'line', data: data.timestamps.map((t, i) => [t, data.tempExt[i] || null]) }
        ]
    });
}

// Handle window resize
window.onresize = () => {
    chart.resize();
};
    </script>
</body>
</html>
